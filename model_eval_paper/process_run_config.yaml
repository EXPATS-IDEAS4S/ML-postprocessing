# ==========================
# Experiment Configuration
# ==========================
experiment:
  run_names: #add mulitple names in case a comparison has to be done (like chacking loss)
    - dcv2_resnet_k7_ir108_100x100_2013-2020_1xrandomcrops_1xtimestamp_cma_nc
    #- dcv2_ir108_ot_100x100_k9_35k_nc_vit
  epoch: 800          # Epoch number for the main run
  random_state: 3    # Random seed for reproducibility (tsne, sampling selection, training_run)
  base_path: /data1/runs
  path_out: /data1/fig
  from_crop_stats: false  # Use crop stats file instead of crop list file
  test_set: true        # If true, run on the csv files including also the test set 
  
logging:  
  logs_path: /home/Daniele/codes/VISSL_postprocessing/model_eval_paper/logs
  log_level: INFO
  feature_dataset_log_filename: csv_prep.log
  feature_dataset_log_mode: w       # a = append runs; w = replace the previous log

# ==========================
# Dimensionality Reduction
# can be expanded, if many dim reduction methods will be implemented, consider creating a separate config for it
# ==========================
reduction:
  method: tsne            # Options: tsne, isomap, etc., 
  perplexity: 50


# ==========================
# Data / Crops Configuration / Sampling Configuration
# ==========================
data:
  data_base_path: /data1/crops
  crops_name: ir108_100x100_2013-2020_3xrandomcrops_1xtimestamp_cma_nc # name of the dataset, TODO implement the case with more runs
  file_extension: nc   # Options: nc, tif
  crop_split: "1"                       # Crop split folder under data/<file_extension>/
  nc_engine: netcdf4   #engine for xarray, choose between {"netcdf4", "scipy", "pydap", "h5netcdf", "zarr", None}
  sampling_type: all   # Options: random, closest, farthest, all
  n_subsample: 1000 #70072   # Max samples per cluster. TODO: if 'all', use all samples without specifying here
  filter_daytime: false  # Keep only 06–16 UTC
  filter_imerg: false    # Keep only timestamps at minutes 00 or 30, as IMERG product (set to true only if precipitation is used and n_frames==1)
  n_frames: 1 # Number of frames to consider for each crop




# ==========================
# Statistics
# ==========================
statistics:
  spatial:
    sel_vars:
      - cth
      - cma
      - cot
      - cth_categories
      - cot_categories
      - day_night
      - cph
      - rain_rate
      - area_prec
      - cum_prec
      - euclid_msg_grid
      #- radar_prec
    percentiles: [50, 99, 25, 75]  # percentiles to compute (IQR can be derived from 25 and 75)
    #TODO implement something to evalaute the cloud organization (Iorg, spectral analysis, aspect_ratio, aggregation...)

    # NEW: control whether spatial metrics are per-frame or aggregated
    mode: aggregated      # compute metrics at each timestep separately (then this can be also used to check the change in time of the spatial metrics)
      #- aggregated or per_frame   # collapse all frames into one distribution


  # Time-development statistics (multi-frame evolution across time dimension)
  temporal:
    enabled: false
    metrics:
      - cloud_cover_change   # ΔCC / Δt, relative CC change
      - vertical_growth      # ΔCTH / Δt, max/mean option handled in code
      - horizontal_motion    # displacement & velocity
      - motion_direction     # azimuth angle of displacement vector
    options:
      normalize_by_duration: true   # normalize Δ by total time length
      convective_ref: "max_cth"     # how to define "cloud center" (max_cth, center_of_mass, ...)

  # General flags
  include_geotime: true      # Include geospatial and temporal metadata (month, hour, lat_mid, lon_mid)
  time_dimension: false       # Global flag: whether time metrics should be computed at all
  use_parallel: false        # Parallelization (logging issue with joblib)
  n_cores: 4                 # Number of CPU cores


# ==========================
# Convective Sample Selection
# ==========================
convective_selection:
  convective_classes: [6, 1, 5]       # Class labels considered convective
  distance_threshold: 0.5              # Cosine similarity threshold to convective centroids
  output_suffix: convective_selected   # Output subfolder under experiment.path_out/<run_name>/
  feature_file_train_inds: rank0_chunk0_train_heads_inds.npy
  feature_file_train_features: rank0_chunk0_train_heads_features.npy
  train_assignments_file: assignments.pt
  train_distances_file: distances.pt
  train_centroids_file: centroids0.pt


# ==========================
# Feature Dataset Preparation
# Used by scripts/pretrain/prepare_samples/prepare_feature_dataset.py
# Vector type encoding in output CSV:
#   split       : TRAIN | TEST | CENTROID
#   source_type : SAT | MODEL | <null>
#   event_type  : PRECIP | HAIL | TRAJ | <null>
#   vector_type : convenience concat, e.g. SAT_PRECIP, MODEL_TRAJ, TRAIN, CENTROID
# ==========================
feature_preparation:
  output_suffix: teamx_test_new             # Subfolder under experiment.path_out/<run_name>/
  output_filename: features      # CSV filename prefix
  metadata_workers: 8             # Parallel NetCDF metadata readers; use 1 to disable

  # Feature file names shared by train and all test sets
  feature_file_inds: rank0_chunk0_train_heads_inds.npy
  feature_file_features: rank0_chunk0_train_heads_features.npy

  # Checkpoint filenames (relative to <base_path>/<run_name>/checkpoints/)
  assignments_file: assignments.pt
  distances_file:   distances.pt
  centroids_file:   centroids0.pt

  # --- Training set ---
  train:
    enabled: true
    source_type: SAT                  # SAT | MODEL; defaults to SAT
    crop_split: "1"                    # Subfolder under data/<file_extension>/
    subsample: null                    # Max samples (null = all)
    include_timestamp: true
    include_latlon: true
    extract_latlon_from_filename: false
    include_2d_features: true

  # --- Centroid rows ---
  centroids:
    enabled: true                      # Include centroid vectors as rows in the output CSV

  # --- Test sets ---
  test:
    enabled: true                     # Master switch; set to true to include any test set

    label_top_k: 2                     # 1 = top-1 label only; 2 = also add label_2nd column

    # Global defaults (each set entry below can override individual keys)
    include_timestamp: true
    include_latlon: true
    extract_latlon_from_filename: false
    subsample: null                    # Global subsample; per-set key overrides this

    sets:
      - name: TEAMX_MSG               # Used in per-set CSV filename
        source_type: SAT               # SAT | MODEL
        crops_path: /data1/crops/teamx_Apr-Sep_2025_icon_msg_new/nc/MSG/1/
        feat_dir: /data1/runs/{run_name}/teamx_features_msg/epoch_800/
        mark_case_study: false         # Override source_type from msg/icon filename markers
        storm_summary_file: null       # Filename of storm summary CSV (null = skip merge)
        storm_summary_dir: null        # Directory containing the summary file

      - name: TEAMX_ICON_00               # Used in per-set CSV filename
        source_type: MODEL               # SAT | MODEL
        crops_path: /data1/crops/teamx_Apr-Sep_2025_icon_msg_new/nc/ICON_00/1/
        feat_dir: /data1/runs/{run_name}/teamx_features_icon_00/epoch_800/
        mark_case_study: false         # Override source_type from msg/icon filename markers
        storm_summary_file: null       # Filename of storm summary CSV (null = skip merge)
        storm_summary_dir: null        # Directory containing the summary file

      - name: TEAMX_ICON_12               # Used in per-set CSV filename
        source_type: MODEL               # SAT | MODEL
        crops_path: /data1/crops/teamx_Apr-Sep_2025_icon_msg_new/nc/ICON_12/1/
        feat_dir: /data1/runs/{run_name}/teamx_features_icon_12/epoch_800/
        mark_case_study: false         # Override source_type from msg/icon filename markers
        storm_summary_file: null       # Filename of storm summary CSV (null = skip merge)
        storm_summary_dir: null        # Directory containing the summary file

# ==========================
# NetCDF to PNG Visualization
# ==========================
visualization:
  datasets:
    - name: TEAMX_MSG
      input_dir: /data1/crops/teamx_Apr-Sep_2025_icon_msg_new/nc/MSG/1/
      output_dir: /data1/crops/teamx_Apr-Sep_2025_icon_msg_new/img/IR_108
      var_name: IR_108               # Single variable, e.g. IR_108 or WV_062-IR_108
      max_files: null                # null converts all files
